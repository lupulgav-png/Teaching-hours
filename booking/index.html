<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Privatlektionen">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <title>Privatlektionen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <style>
:root {
  --bg: #F7F5EF; --surface: #FFFFFF; --surface-2: #F1EEE6;
  --ink: #171613; --ink-2: #57544C; --ink-3: #8D897F; --line: #E6E2D8;
  --accent: #F2C200; --accent-ink: #2A2200; --accent-soft: #FFF6CC;
  --ok: #1F7A3E; --ok-soft: #E6F4EA; --warn: #A85B00; --warn-soft: #FFF1DE;
  --bad: #B3261E; --bad-soft: #FDECEA; --info-soft: #EEF1F6; --blue: #2F5DA8;
  --r: 14px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 10px rgba(0,0,0,.04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412; --surface: #201F1C; --surface-2: #2A2925;
    --ink: #F3F1EA; --ink-2: #C3BFB4; --ink-3: #8F8B81; --line: #34322D;
    --accent: #F2C200; --accent-ink: #1E1800; --accent-soft: #3A3210;
    --ok: #6FCF8E; --ok-soft: #173322; --warn: #F0A848; --warn-soft: #3A2A12;
    --bad: #F28B82; --bad-soft: #3A1A18; --info-soft: #23272F; --blue: #8DB0EC;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { min-height: 100dvh; }
body.sheet-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px); }
.top { padding: 14px 2px 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.top h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.sum { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: 14px; }
.sec { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 22px 4px 8px; }
.sec-toggle { display: block; background: none; border: 0; color: var(--ink-2); font-size: 15px; font-weight: 600; padding: 18px 4px 8px; cursor: pointer; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.card h2 { font-size: 17px; margin-bottom: 10px; }
.card.appt { cursor: pointer; transition: transform .12s; }
.card.appt:active { transform: scale(.985); }
.card.cancelled h3 { text-decoration: line-through; color: var(--ink-3); }
.card.slim { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
.row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row1 h3 { font-size: 17px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row2 { margin-top: 4px; font-weight: 500; }
.row3 { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.row4 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 8px; }
.flag svg { width: 14px; height: 14px; }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.flag.ok { background: var(--ok-soft); color: var(--ok); }
.muted { color: var(--ink-3); }
.small, small { font-size: 13px; }
.missing { color: var(--bad); }

.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; flex: none; }
.st-offen { border-color: var(--line); color: var(--ink-2); background: var(--surface-2); }
.st-angefragt { background: var(--info-soft); color: var(--blue); }
.st-raum { background: var(--accent-soft); color: var(--warn); }
.st-bestaetigt { background: var(--ok-soft); color: var(--ok); }
.st-erledigt { background: var(--surface-2); color: var(--ink-3); }
.st-storniert { background: var(--bad-soft); color: var(--bad); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:active { opacity: .7; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.sm svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.next { background: var(--ok-soft); color: var(--ok); border-color: transparent; margin-top: 10px; }
.btn.wide { width: 100%; }
.btn.mic.rec { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .75; } }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.icon { background: none; border: 0; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-3); cursor: pointer; }
.link { background: none; border: 0; color: var(--blue); text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }
.banner { display: block; width: 100%; text-align: left; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; font-weight: 600; cursor: pointer; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); }
.empty .btn { margin-top: 14px; }

.voice textarea, .msgtext { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px; resize: vertical; font-size: 16px; }
.voice .lead { font-weight: 600; margin-bottom: 8px; }
.voice-actions { display: flex; gap: 8px; margin-top: 10px; }
.voice-actions .btn { flex: 1; }
.hint { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
.card.voice + .btn { margin-bottom: 4px; }

.draft-head { display: flex; justify-content: space-between; align-items: center; }
.raw { font-size: 13px; color: var(--ink-3); font-style: italic; margin: 2px 0 8px; }
.form { display: flex; flex-direction: column; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.fld input, .fld select, .fld textarea, .loc-name { width: 100%; min-width: 0; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 16px; -webkit-appearance: none; appearance: none; }
.fld select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.fld input[type=date], .fld input[type=time] { display: block; }
.fld.need input { border-color: var(--bad); background: var(--bad-soft); }
.fld input:focus, .fld select:focus, .fld textarea:focus, .msgtext:focus, .voice textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.src { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 6px; }
.src.ok { background: var(--ok-soft); color: var(--ok); }
.src.std { background: var(--surface-2); color: var(--ink-3); }
.src.chk { background: var(--warn-soft); color: var(--warn); }
.src.bad { background: var(--bad-soft); color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pick { min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; }
.pick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mini { width: 84px; min-height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--surface); font-size: 16px; }
.mini.on { border-color: var(--accent); outline: 2px solid var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.sticky-save { position: sticky; bottom: calc(env(safe-area-inset-bottom) + 76px); padding: 8px 0; }
.sticky-save .btn { box-shadow: 0 4px 18px rgba(0,0,0,.15); min-height: 50px; font-size: 17px; }

.alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
.alert svg { margin-top: 1px; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.warn div { color: var(--ink); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert.info { background: var(--info-soft); color: var(--ink-2); }

.card.msg { padding-bottom: 12px; }
.card.msg .msgtext { margin-top: 10px; line-height: 1.45; }
.msg-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.msg-actions .btn.primary { flex: 1 1 140px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); border-top: 1px solid var(--line); padding: 6px 4px calc(env(safe-area-inset-bottom) + 4px); }
.tab { position: relative; flex: 1; max-width: 128px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; color: var(--ink-3); font-size: 11px; font-weight: 600; padding: 4px 0; cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--ink); }
.tab.on svg { stroke-width: 2.2; }
.badge { position: absolute; top: 0; left: calc(50% + 6px); background: var(--bad); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }

#sheet { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#sheet.open { pointer-events: auto; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.35); animation: fade .2s; }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 24px); max-width: 640px; margin: 0 auto; background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.32,.72,0,1); }
.sheet-bar { display: flex; justify-content: flex-end; padding: 8px 10px 0; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(env(safe-area-inset-bottom) + 30px); flex: 1; }
.sheet-title { font-size: 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.block { margin-top: 18px; }
.block > h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 8px; }
.block .seg { margin-bottom: 8px; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.steps { display: flex; flex-direction: column; gap: 4px; }
.step { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.step i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--ink-3); flex: none; }
.step span { display: flex; flex-direction: column; font-weight: 600; font-size: 15px; }
.step small { font-weight: 400; color: var(--ink-3); }
.step.done i { background: var(--ok-soft); color: var(--ok); }
.step.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.step.cur i { background: var(--accent); color: var(--accent-ink); }
.lesson { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.lesson .muted { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block > .btn.primary.sm { margin-bottom: 6px; }

.loc { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.loc-head { display: flex; gap: 6px; align-items: center; }
.loc-name { font-weight: 650; }
.card .fld + .fld, .card .loc + .btn { margin-top: 10px; }
.card > .fld { margin-top: 10px; }
details { margin-top: 12px; }
summary { font-weight: 600; cursor: pointer; color: var(--blue); }
details ol { padding-left: 20px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.switch { display: flex; gap: 10px; align-items: center; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.foot { text-align: center; color: var(--ink-3); font-size: 12px; margin: 20px 0; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .22s; z-index: 60; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; cursor: pointer; }

#lock { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: none; place-items: center; padding: 24px; }
#lock.open { display: grid; }
.lock-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.lock-box svg { width: 40px; height: 40px; color: var(--ink-3); }
.lock-box input { width: 100%; text-align: center; font-size: 28px; letter-spacing: .4em; min-height: 56px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.lock-msg { color: var(--bad); min-height: 1.2em; font-size: 14px; }
noscript { display: block; padding: 40px 20px; text-align: center; }
  </style>
</head>
<body>
  <main id="main"></main>
  <nav id="tabs"></nav>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="lock"></div>
  <noscript>Diese App benötigt JavaScript.</noscript>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
